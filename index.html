<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emma · 영어 책 친구</title>
<style>
  :root{--bg1:#1f3b2d;--bg2:#2f5d45;--cream:#fdf7e6;--gold:#f4c542;--sky:#bfe6ff;--ink:#2a2a2a;--soft:rgba(253,247,230,.65)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100vh}
  body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--cream);
       font-family:"Segoe UI","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
  .hidden{display:none!important}
  header{display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:15px;color:var(--soft)}
  header b{color:var(--cream);font-size:18px}
  header .sp{flex:1}
  #timer{font-variant-numeric:tabular-nums}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 20px 24px}
  .box{width:100%;max-width:720px}

  /* 시작 화면 */
  .start{text-align:center}
  .start .face{font-size:96px;line-height:1}
  .start h1{font-size:40px;margin:10px 0 4px}
  .start p{color:var(--soft);font-size:18px;margin:0 0 28px}
  .big{font-size:26px;font-weight:800;border:0;border-radius:999px;padding:20px 48px;background:var(--gold);color:var(--ink);cursor:pointer;font-family:inherit}
  .big:active{transform:translateY(2px)}
  .books{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
  .bk{font-size:15px;font-weight:700;border:3px solid rgba(253,247,230,.3);background:rgba(255,255,255,.06);color:var(--cream);border-radius:18px;padding:10px 8px;cursor:pointer;font-family:inherit;line-height:1.25}
  .bk .e{display:block;font-size:30px;margin-bottom:2px}
  .otherrow{margin:0 auto 14px;max-width:420px}
  .otherrow input{width:100%;font-size:20px;padding:12px 16px;border-radius:14px;border:3px solid var(--gold);font-family:inherit}
  @media (max-width:760px){.books{grid-template-columns:repeat(2,1fr)}}
  .bk.on{border-color:var(--gold);background:rgba(244,197,66,.18)}

  /* 꾸미기 */
  .dress h2{text-align:center;font-size:30px;margin:0 0 12px}
  .dresswrap{display:flex;gap:22px;align-items:flex-start}
  .dress .avatar{width:230px;position:sticky;top:10px}
  .opts{flex:1;max-height:62vh;overflow:auto;padding-right:6px}
  .opt{margin-bottom:14px}
  .opt .lb{font-size:15px;color:var(--soft);margin-bottom:6px;font-weight:700}
  .opt .its{display:flex;flex-wrap:wrap;gap:8px}
  .it{font-size:16px;border:2px solid rgba(253,247,230,.28);background:transparent;color:var(--cream);border-radius:999px;padding:7px 14px;cursor:pointer;font-family:inherit}
  .it.on{border-color:var(--gold);background:rgba(244,197,66,.22)}
  .sw{width:40px;height:40px;border-radius:50%;border:3px solid rgba(253,247,230,.3);cursor:pointer;padding:0}
  .sw.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,197,66,.5)}
  @media (max-width:760px){.dresswrap{flex-direction:column;align-items:center}.dress .avatar{position:static;width:170px}}

  /* 대화 화면 */
  .emma{display:flex;gap:18px;align-items:center}
  .avatar{flex:0 0 auto;width:210px}
  .avatar svg{width:100%;height:auto;display:block;overflow:visible}
  .start .avatar{width:170px;margin:0 auto}
  .e-tilt{transform-box:view-box;transform-origin:100px 150px;transition:transform .35s ease}
  .avatar.listen .e-tilt{transform:rotate(-8deg)}
  .e-brows{transition:transform .25s}
  .avatar.listen .e-brows{transform:translateY(-5px)}
  .e-eyes{transform-box:view-box;transform-origin:100px 108px}
  .e-ear{opacity:0;transition:opacity .3s}
  .avatar.listen .e-ear{opacity:1}
  .bubble{position:relative}
  .bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:12px solid rgba(255,255,255,.1);border-left:0}
  .bubble{flex:1;background:rgba(255,255,255,.1);border-radius:6px 24px 24px 24px;padding:20px 22px}
  .bubble .en{font-size:28px;line-height:1.45;font-weight:700}
  .bubble .ko{font-size:16px;color:var(--soft);margin-top:8px}
  .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .sm{font-size:15px;border:0;border-radius:999px;padding:8px 16px;background:rgba(253,247,230,.18);color:var(--cream);cursor:pointer;font-family:inherit}
  .sm:hover{background:rgba(253,247,230,.3)}

  .choices{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0 228px}
  .chip{font-size:20px;border:2px solid rgba(253,247,230,.35);background:transparent;color:var(--cream);border-radius:999px;padding:10px 20px;cursor:pointer;font-family:inherit}
  .chip:hover{background:rgba(253,247,230,.12)}
  .chiphint{margin:8px 0 0 228px;font-size:13px;color:var(--soft)}
  @media (max-width:760px){.emma{flex-direction:column}.avatar{width:170px}.bubble::before{display:none}.choices,.chiphint{margin-left:0;justify-content:center;text-align:center}}

  .me{display:flex;justify-content:flex-end;margin-top:22px}
  .mebubble{max-width:80%;background:var(--sky);color:#0b3a57;border-radius:24px 6px 24px 24px;padding:14px 20px;font-size:24px;font-weight:600}
  .mebubble.ko{font-size:20px}

  .mic{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:28px}
  .micbtn{width:120px;height:120px;border-radius:50%;border:0;background:var(--gold);font-size:52px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .micbtn.on{background:#ef5350;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .miclabel{font-size:17px;color:var(--soft)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .next{font-size:20px;font-weight:800;border:0;border-radius:999px;padding:12px 30px;background:var(--cream);color:var(--ink);cursor:pointer;font-family:inherit}
  .next.done{background:var(--gold);animation:pulse 1.4s infinite}
  #vwarn{margin:0 16px 8px;padding:12px 16px;border-radius:14px;background:rgba(239,83,80,.22);
         border:2px solid #ef5350;font-size:15px;line-height:1.55;cursor:pointer}

  .mom{margin-top:26px;text-align:center}
  .mom summary{cursor:pointer;color:var(--soft);font-size:14px}
  .mom .in{display:flex;gap:8px;margin-top:10px}
  .mom input{flex:1;font-size:18px;padding:10px 14px;border-radius:12px;border:0;font-family:inherit}
  .mom.kbd{margin-top:14px}
  .mom.kbd summary{font-size:18px;font-weight:800;color:var(--cream)}
  .mom.kbd input{font-size:22px;padding:16px 18px;border:3px solid var(--gold)}
  .mom.kbd button{font-size:19px;font-weight:800;padding:0 22px}
  .mom button{font-size:16px;border:0;border-radius:12px;padding:0 18px;background:var(--gold);cursor:pointer;font-family:inherit}

  .wrap{text-align:center}
  .wrap .face{font-size:80px}
  .wrap h2{font-size:32px;margin:8px 0}
  .praise{background:rgba(244,197,66,.18);border-radius:18px;padding:18px;font-size:20px;line-height:1.6;margin:18px 0}
  .log{text-align:left;background:rgba(0,0,0,.18);border-radius:16px;padding:14px 18px;font-size:15px;line-height:1.7;max-height:36vh;overflow:auto}
  .log .n{color:var(--sky)}
  footer{text-align:center;font-size:12px;color:var(--soft);padding:0 0 10px}

  /* 🗣 영어회화 모드 */
  .modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
  .md{font-size:18px;font-weight:800;border:3px solid rgba(253,247,230,.3);background:rgba(255,255,255,.06);
      color:var(--cream);border-radius:18px;padding:12px 18px;cursor:pointer;font-family:inherit;min-width:150px}
  .md small{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-top:3px}
  .md.on{border-color:var(--gold);background:rgba(244,197,66,.22)}
  .md:hover{border-color:var(--gold)}

  /* 🎧 음원 듣기 */
  .lsthead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .crumb{flex:1;min-width:0;font-size:15px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lstbox{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding-right:4px}
  .lstitem{display:flex;align-items:center;gap:10px;text-align:left;font-size:17px;font-weight:700;
           border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:inherit;
           border-radius:14px;padding:12px 14px;cursor:pointer;font-family:inherit;width:100%}
  .lstitem:hover{border-color:var(--gold)}
  .lstitem .ic{font-size:22px;flex:0 0 auto}
  .lstitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lstitem .mn{font-size:13px;opacity:.6;flex:0 0 auto}
  .lstitem.playing{border-color:var(--gold);background:rgba(244,197,66,.18)}
  .player{background:rgba(0,0,0,.25);border-radius:18px;padding:14px 16px;margin-bottom:14px}
  .player .ttl{font-size:16px;font-weight:800;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbar{width:100%;height:8px;border-radius:999px;background:rgba(255,255,255,.18);cursor:pointer;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:var(--gold)}
  .ptime{display:flex;justify-content:space-between;font-size:13px;opacity:.7;margin-top:6px}
  .pctl{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .pbtn{font-size:18px;border:0;border-radius:999px;padding:10px 16px;background:rgba(255,255,255,.16);
        color:inherit;cursor:pointer;font-family:inherit;font-weight:700}
  .pbtn.big{font-size:26px;padding:10px 22px;background:var(--gold);color:#3a2a00}
  .pbtn.on{background:var(--gold);color:#3a2a00}
  /* 🎧 듣기 화면에서 쓰는 것들 (Emma에 없던 클래스) */
  .bookhead{text-align:center;margin-bottom:14px}
  .bookhead h2{font-size:28px;margin:4px 0}
  .bookhead p{color:var(--soft);font-size:15px;margin:0}
  .icon{font-size:15px;border:0;border-radius:12px;padding:9px 12px;background:rgba(253,247,230,.16);color:var(--cream);cursor:pointer;font-family:inherit}
  .empty{text-align:center;color:var(--soft);font-size:15px;padding:18px;line-height:1.6}
</style>
</head>
<body>
<header>
  <b>👧🏼 Emma</b><span id="booktag">영어 책 친구</span>
  <span class="sp"></span>
  <span id="timer"></span>
</header>
<div id="vwarn" class="hidden"></div>

<main>
  <!-- 시작 -->
  <section id="start" class="box start">
    <div class="avatar" id="avStart"></div>
    <h1>Emma 만나기</h1>
    <p>나율이의 영어 책 친구 · 10분만 가볍게</p>
    <div class="modes" id="modes">
      <button class="md" data-md="parrot">🦜 따라 말하기<small>Emma 말을 그대로</small></button>
      <button class="md" data-md="talk">🗣 영어회화<small>내가 직접 · 힌트 있음</small></button>
      <button class="md on" data-md="book">📖 책 이야기<small>읽은 책으로</small></button>
    </div>
    <div class="books" id="books"></div>
    <div class="otherrow hidden" id="otherRow"><input id="otherTitle" placeholder="읽은 책 제목을 적어 줘 (영어로)"></div>
    <div class="otherrow hidden" id="boxRow" style="align-items:center;gap:8px">
      <span style="font-size:15px;opacity:.8;white-space:nowrap">박스카 몇 권까지 읽었어?</span>
      <input id="boxBookNo" type="number" min="1" max="19" style="width:90px">
      <span style="font-size:15px;opacity:.8">권</span>
    </div>
    <div class="otherrow hidden" id="mthRow" style="align-items:center;gap:8px">
      <span style="font-size:15px;opacity:.8;white-space:nowrap">매직트리하우스 몇 권까지 읽었어?</span>
      <input id="mthBookNo" type="number" min="1" max="28" style="width:90px">
      <span style="font-size:15px;opacity:.8">권</span>
    </div>
    <div class="otherrow hidden" id="aesopRow">
      <div style="font-size:15px;opacity:.8;margin-bottom:6px">어떤 이야기를 들었어?</div>
      <select id="aesopPick" style="width:100%;font-size:17px;padding:12px 14px;border-radius:14px;border:3px solid var(--gold);font-family:inherit"></select>
    </div>
    <button class="big" id="go">▶ 시작하기</button>
    <div style="margin-top:14px"><button class="sm" id="dressBtn">👗 Emma 꾸미기</button>
      <button class="sm hidden" id="listenBtn">🎧 음원 듣기</button></div>
  </section>

  <!-- 꾸미기 -->
  <section id="dress" class="box dress hidden">
    <h2>👗 Emma 꾸미기</h2>
    <div class="dresswrap">
      <div class="avatar" id="avDress"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="sm" id="rand">🎲 아무거나</button>
      <button class="sm" id="reset">처음 모습으로</button>
      <button class="next" id="dressDone">완성! ✨</button>
    </div>
  </section>

  <!-- 대화 -->
  <section id="talk" class="box hidden">
    <div class="emma">
      <div class="avatar" id="avTalk"></div>
      <div class="bubble">
        <div class="en" id="en"></div>
        <div class="ko hidden" id="ko"></div>
        <div class="tools">
          <button class="sm" id="again">🔁 다시 듣기</button>
          <button class="sm" id="slow">🐢 천천히</button>
          <button class="sm" id="showko">뜻 보기</button>
        </div>
      </div>
    </div>

    <div class="choices" id="choices"></div>
    <div class="chiphint hidden" id="chiphint">누르면 Emma가 읽어 줘요 → 따라 말해 봐요</div>

    <div class="me hidden" id="me"><div class="mebubble" id="said"></div></div>

    <div class="mic">
      <button class="micbtn" id="mic" title="영어로 말하기">🎤</button>
      <div class="miclabel" id="miclabel">눌러서 영어로 말해 봐</div>
      <div class="row">
        <button class="sm" id="micko">🇰🇷 한국어로 말할래</button>
        <button class="next" id="next">다음 →</button>
      </div>
    </div>

    <!-- 대화 중에도 언제든 처음으로. 다음 → 와 멀찍이 떨어뜨려 실수로 안 눌리게 둔다.
         한 마디라도 했으면 그냥 버리지 않고 칭찬 화면으로 보내 기록까지 남긴다(quitTalk). -->
    <div class="row" style="margin-top:18px">
      <button class="sm" id="quit">🏠 그만하고 처음으로</button>
    </div>

    <details class="mom">
      <summary>엄마가 대신 적기 (마이크가 안 될 때)</summary>
      <div class="in">
        <input id="typed" placeholder="나율이가 한 말 (한국어·영어 모두 OK)">
        <button id="send">보내기</button>
      </div>
    </details>
  </section>


  <!-- 🎧 음원 듣기 -->
  <section id="listen" class="box hidden">
    <div class="bookhead"><h2>🎧 음원 듣기</h2><p>집에 있는 음원이야 · 듣고 나서 같이 이야기하자</p></div>

    <div class="player hidden" id="player" data-rate="1">
      <div class="ttl" id="ptitle"></div>
      <div class="pbar" id="pbar"><i id="pfill"></i></div>
      <div class="ptime"><span id="pnow">0:00</span><span id="pdur">0:00</span></div>
      <div class="pctl">
        <button class="pbtn" id="pback">⏪ 10초</button>
        <button class="pbtn big" id="pplay">▶</button>
        <button class="pbtn" id="pfwd">10초 ⏩</button>
      </div>
      <div class="pctl">
        <button class="pbtn prate" data-rate="0.75">0.75×</button>
        <button class="pbtn prate on" data-rate="1">1×</button>
        <button class="pbtn prate" data-rate="1.25">1.25×</button>
      </div>
    </div>

    <div class="lsthead">
      <button class="icon" id="lstup" style="visibility:hidden">← 위로</button>
      <div class="crumb" id="crumb">음원 서재</div>
    </div>
    <div class="lstbox" id="lstbox"></div>

    <div class="row" style="margin-top:16px">
      <button class="next" id="lstTalk">📖 이 책으로 이야기하기</button>
      <button class="sm" id="lstBack">← 돌아가기</button>
    </div>
  </section>
  <!-- 마무리 -->
  <section id="end" class="box wrap hidden">
    <div class="face">🎉</div>
    <h2>오늘도 Emma랑 이야기했어!</h2>
    <div class="praise" id="praise"></div>
    <div class="log" id="log"></div>
    <div class="row" style="margin-top:18px">
      <button class="next" id="copy">📋 나도에게 줄 기록 복사</button>
      <button class="sm" id="home">처음으로</button>
    </div>
  </section>
</main>
<footer id="voice"></footer>

<script>
/* ---------------- 움직이는 Emma (말하면 입이 움직이고, 눈을 깜빡이고, 들을 때 고개를 기울인다) ---------------- */
/* ---- Emma 꾸미기: 나율이가 고른 모습(localStorage 'emmaLook') ---- */
const LOOK_OPTIONS={
  hair:{label:'머리 모양', items:[['pigtails','양갈래'],['long','긴 머리'],['bob','단발'],['ponytail','포니테일'],['buns','똥머리 두 개'],['short','짧은 머리']]},
  hairColor:{label:'머리색', swatch:true, items:[['#e3a653','금발'],['#7a4a25','갈색'],['#2b2220','검정'],['#c8552b','빨강'],['#ff8fc7','분홍'],['#9b6be0','보라'],['#5fb6e8','하늘']]},
  skin:{label:'피부색', swatch:true, items:[['#ffe3cc','밝은'],['#ffdcbc','살구'],['#e8b48a','구릿빛'],['#b97a52','갈색']]},
  eyes:{label:'눈 색', swatch:true, items:[['#3b6fb6','파랑'],['#6b4226','갈색'],['#3f9a5a','초록'],['#8a5bd6','보라'],['#222222','검정']]},
  outfit:{label:'옷 색', swatch:true, items:[['#5bbf8a','초록'],['#ff7aa8','분홍'],['#ffc93c','노랑'],['#5fb6e8','하늘'],['#9b6be0','보라'],['#ef5350','빨강'],['#ffffff','하양']]},
  acc:{label:'꾸미개', items:[['none','없음'],['bow','리본'],['headband','머리띠'],['glasses','안경'],['star','별 핀'],['cat','고양이 귀'],['flower','꽃']]},
  freckles:{label:'주근깨', items:[['on','있음'],['off','없음']]}
};
const DEFAULT_LOOK={hair:'pigtails',hairColor:'#e3a653',skin:'#ffdcbc',eyes:'#3b6fb6',outfit:'#5bbf8a',acc:'none',freckles:'on'};
let LOOK={...DEFAULT_LOOK};
try{ LOOK={...DEFAULT_LOOK, ...JSON.parse(localStorage.getItem('emmaLook')||'{}')}; }catch(e){}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(v*(1+amt))));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function emmaSVG(L){
  const hc=L.hairColor, hd=shade(hc,-.18), sk=L.skin, skd=shade(sk,-.06);
  const back={
    pigtails:`<circle cx="34" cy="118" r="22" fill="${hd}"/><circle cx="166" cy="118" r="22" fill="${hd}"/>
              <path d="M34 60 C50 20 150 20 166 60 L170 120 L30 120 Z" fill="${hd}"/>
              <circle cx="44" cy="100" r="6" fill="#ff7aa8"/><circle cx="156" cy="100" r="6" fill="#ff7aa8"/>`,
    long:`<path d="M36 70 C44 18 156 18 164 70 L174 200 C150 212 50 212 26 200 Z" fill="${hd}"/>`,
    bob:`<path d="M36 70 C44 20 156 20 164 70 L168 140 C156 150 140 146 136 132 L64 132 C60 146 44 150 32 140 Z" fill="${hd}"/>`,

const Emma=(()=>{
  const hosts=[];
  let talking=false, open=0, target=0, nextChange=0, t0=performance.now();
  function mount(el){ el.innerHTML=emmaSVG(LOOK); hosts.push(el); }
  function each(fn){ hosts.forEach(h=>fn(h)); }
  function blink(){
    each(h=>{const e=h.querySelector('.e-eyes'); e.animate([{transform:'scaleY(1)'},{transform:'scaleY(.08)'},{transform:'scaleY(1)'}],{duration:180});});
    setTimeout(blink, 2500+Math.random()*3000);
  }
  function frame(now){
    if(talking){
      if(now>nextChange){ target=Math.random()<.18?1:3+Math.random()*9; nextChange=now+70+Math.random()*80; }
    } else target=0;
    open+= (target-open)*0.45;
    const bob = talking ? Math.sin((now-t0)/160)*1.6 : Math.sin((now-t0)/900)*1.2;
    each(h=>{
      const isOpen=open>1.2;
      h.querySelector('.e-smile').style.display=isOpen?'none':'';
      h.querySelector('.e-open').style.display=isOpen?'':'none';
      if(isOpen){
        h.querySelector('.e-mouth').setAttribute('ry',open.toFixed(1));
        h.querySelector('.e-mouth').setAttribute('rx',(9+open*0.35).toFixed(1));
        h.querySelector('.e-tongue').setAttribute('cy',(143+open*0.55).toFixed(1));
        h.querySelector('.e-teeth').setAttribute('y',(143-open+1).toFixed(1));
      }
      h.querySelector('.e-bob').setAttribute('transform',`translate(0 ${bob.toFixed(2)})`);
    });
    requestAnimationFrame(frame);
  }
  return {
    init(){ ['avStart','avTalk','avDress'].forEach(id=>mount(document.getElementById(id))); requestAnimationFrame(frame); setTimeout(blink,1500); },
    redraw(){ each(h=>{ const l=h.classList.contains('listen'); h.innerHTML=emmaSVG(LOOK); h.classList.toggle('listen',l); }); },
    talk(on){ talking=on; },
    pulse(){ if(talking){ target=10+Math.random()*3; nextChange=performance.now()+110; } },
    listen(on){ each(h=>h.classList.toggle('listen',on)); }
  };
})();

/* ---------------- 목소리 ----------------
   이 컴퓨터에 깔린 목소리는 한국어(Heami)·일본어뿐이다. 영어 목소리는
   엣지가 인터넷에서 받아오는 "Online (Natural)" 뿐인데, 이게 몇 초 늦게 도착한다.
   그 사이에 말을 시키면 윈도우가 기본 목소리(한국어)로 영어를 읽어 버린다 → 발음이 엉망이 된다.
   그래서 ①목소리가 올 때까지 기다리고 ②늦게 와도 그때 잡고
   ③끝내 영어 목소리가 없으면 한국어 목소리로 영어를 읽지 않고 화면에 알린다. */
const PREFS=['Ana Online (Natural)','Ava Online (Natural)','Emma Online (Natural)','Jenny Online (Natural)','Aria Online (Natural)','Natural'];
let VOICE=null, KOVOICE=null, voiceHooked=false, voiceWaiting=null;
const allVoices=()=>{ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } };
const enVoices=()=>allVoices().filter(v=>/^en/i.test(v.lang||''));
function pickVoice(){
  const vs=enVoices();
  for(const p of PREFS){ const v=vs.find(x=>(x.name||'').includes(p)); if(v) return v; }
  return vs.find(v=>/^en-US/i.test(v.lang)) || vs[0] || null;   // 자연 음성이 없으면 영어면 아무거나(Zira 등)
}
function pickKoVoice(){
  const vs=allVoices().filter(v=>/^ko/i.test(v.lang||''));
  return vs.find(v=>/Natural/i.test(v.name||'')) || vs[0] || null;
}
function rescan(){ VOICE=pickVoice(); KOVOICE=pickKoVoice(); showVoice(); return VOICE; }
function loadVoice(){
  if(VOICE) { showVoice(); return Promise.resolve(); }
  if(voiceWaiting) return voiceWaiting;
  voiceWaiting=new Promise(res=>{
    let done=false;
    const tryPick=()=>{ rescan(); if(VOICE && !done){ done=true; clearInterval(iv); voiceWaiting=null; res(); } };
    if(!voiceHooked){ voiceHooked=true; try{ speechSynthesis.addEventListener('voiceschanged',()=>rescan()); }catch(e){} }
    const iv=setInterval(tryPick,250);          // 엣지 온라인 목소리는 몇 초 뒤에 도착한다
    tryPick();
    setTimeout(()=>{ if(!done){ done=true; clearInterval(iv); voiceWaiting=null; res(); } },8000);
  });
  return voiceWaiting;
}
function showVoice(){
  const f=document.getElementById('voice');
  if(f) f.textContent = VOICE ? ('목소리: '+VOICE.name+(/Natural/i.test(VOICE.name)?'':' · 자연 음성 아님'))
                              : '영어 목소리를 찾는 중… (인터넷 연결 확인 · 눌러서 다시 찾기)';
  const w=document.getElementById('vwarn');
  if(w){
    w.classList.toggle('hidden',!!VOICE);
    if(!VOICE) w.innerHTML='🔇 <b>영어 목소리를 못 찾았어요.</b> 이 컴퓨터엔 한국어·일본어 목소리뿐이라, '
      +'영어 목소리(엣지 자연 음성)는 인터넷에서 받아옵니다.<br>인터넷을 확인하고 <b>여기를 눌러 다시 찾기</b>. '
      +'한국어 목소리로 영어를 읽으면 발음이 이상해져서, 찾을 때까지 영어는 소리 내지 않아요.';
  }
}
function say(text,rate=0.92){
  return new Promise(res=>{
    speechSynthesis.cancel();
    const isKo=/[가-힣]/.test(text);
    if(!VOICE) VOICE=pickVoice();                  // 늦게 도착한 목소리를 그때라도 잡는다
    if(isKo && !KOVOICE) KOVOICE=pickKoVoice();
    const v = isKo ? KOVOICE : VOICE;
    // 영어인데 영어 목소리가 없으면 읽지 않는다 — 한국어 목소리로 읽으면 발음을 잘못 배운다
    if(!isKo && !v){ showVoice(); return res(); }
    const u=new SpeechSynthesisUtterance(text);
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang = isKo ? 'ko-KR' : 'en-US';
    u.rate=rate; u.pitch=1.05;
    u.onstart=()=>Emma.talk(true);
    u.onboundary=()=>Emma.pulse();
    u.onend=()=>{Emma.talk(false);res();}; u.onerror=()=>{Emma.talk(false);res();};
    speechSynthesis.speak(u);
  });
}

function helloStep(title){
  return {en:`Hi Nayul! It's me, Emma. I heard you are reading ${title}. Let's talk about it!`,
    ko:`안녕 나율! 나 Emma야. 너 ${title} 읽는다며? 그 책 이야기 하자!`,
    choices:["Hi Emma!","Okay!"], model:()=>"Hi Emma! Okay!", react:()=>"Yay! I'm so excited!"};
}
function numberStep(title){
  return {en:`Which ${title} book are you reading? Tell me the number!`, ko:"몇 권 읽고 있어? 번호를 말해 줘!",
    choices:["Book one","Book two","I don't know"], model:()=>"I am reading book one.",
    react:t=>{
      const nums={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
      let m=t.match(/\d+/); let n=m?+m[0]:null;
      if(!n){for(const k in nums) if(new RegExp('\\b'+k+'\\b','i').test(t)) n=nums[k];}
      if(n){state.book=n; return `Book ${n}! Cool!`;}
      return "That's okay!";
    }};
}
// 인물 고르기 + 왜 좋아? (pron: 이름 → he/she/it)
function charSteps(pron, koMap){
  const names=Object.keys(pron);
  const list=names.slice(0,-1).join('? ')+'? Or '+names[names.length-1]+'?';
  return [
   {en:`Who do you like the most? ${list}`, ko:"누가 제일 좋아?",
    choices:names, model:()=>`I like ${names[0]}.`,
    koModel:t=>{const h=koMap.find(([re])=>re.test(t)); return h?`I like ${h[1]}.`:null;},
    react:t=>{
      const n=names.find(x=>new RegExp(x.replace('.','\\.?'),'i').test(t));
      if(n){state.fav=n; return `${n}! You like ${n.replace(/\.$/,'')}. Me too!`;}
      return "Oh, nice!";
    }},
   {en:()=>{const n=state.fav; const p=pron[n]||'they'; return `Why do you like ${n||'them'}? ${p==='they'?'Are':'Is'} ${p} kind? Or funny? Or brave?`;},
    ko:"왜 좋아? 착해서? 웃겨서? 용감해서?",
    choices:()=>{const p=pron[state.fav]||'they'; const P=cap(p), b=p==='they'?'are':'is'; return [`${P} ${b} kind.`,`${P} ${b} funny.`,`${P} ${b} brave.`];},
    model:()=>"She is funny.",
    react:t=>{const a=['kind','smart','funny','brave','cute','nice','strong','cool'].find(x=>new RegExp(x,'i').test(t)); return a?`${cap(a)}! Yes, I think so too.`:pick(["Oh, I see!","That's a good reason!"]);},
    follow:()=>`What else do you like about ${{he:'him',she:'her',it:'it'}[pron[state.fav]]||'them'}?`}
  ];
}

const OTHER_STEPS=()=>[
  helloStep(state.title||"a new book"),
  {en:"Who is the main character?", ko:"주인공은 누구야?",
   choices:["The main character is …"], chipsNoSpeak:true, model:()=>"The main character is …",
   react:t=>{const m=clean(t).match(/character is\s+(.+)/i); return m?`${cap(m[1])}! Nice!`:"Oh, nice!";}, follow:"Do you like the main character? Why?"},
  {en:"Where does the story happen? At a school? In a house? Or somewhere else?", ko:"이야기는 어디에서 일어나? 학교? 집? 다른 곳?",
   choices:["At a school.","In a house.","In a forest."], model:()=>"It happens at a school.",
   react:()=>"Oh, I see!", follow:"Would you like to go there?"},
  {en:"Was there a problem in the story?", ko:"이야기 속에 문제가 있었어?",
   choices:["The problem was …","No problem."], chipsNoSpeak:true, model:()=>"The problem was …",
   react:t=>/no problem/i.test(t)?"No problem? Okay!":"Oh no! That's a big problem.", follow:"How did they fix it?"},
  ...commonQs()
];

/* 🦜 따라 말하기 — 여기도 영어회화와 같은 10분 눈금.
   한 주제(8~10줄)로 끝내면 금방 동난다 → 주제를 이어 붙이고, 넘어가는 자리는 lead 한마디로 알린다. */
const PARROT_WANT=20;
function parrotSteps(key){
  const set=TALK_SETS[key];
  const mk=(s,isFirst)=>s.lines.map((L,k)=>({
    en:L.en, ko:L.ko, choices:[L.en], practice:true, r:L.r, model:()=>L.en,
    lead: k===0
      ? (isFirst ? "First, the question. Say it with me!"
                 : `Okay, something new — ${s.name_en||'this'}. Say it with me!`)
      : (L.r==='q' ? pick(["Now you ask me this!","Your turn to ask!","Here comes the question!"])
                   : pick(["And here's how you answer.","Now answer like this.","This is what you could say.","And you can say..."]))}));
  let lines=mk(set,true);
  const rest=Object.keys(TALK_SETS).filter(k=>k!==key);
  while(lines.length<PARROT_WANT && rest.length){
    const k=rest.splice(Math.floor(Math.random()*rest.length),1)[0];
    lines=lines.concat(mk(TALK_SETS[k],false));
  }
  return [
    {en:`Hi Nayul! It's Emma. Today we'll practice a few different things — starting with ${set.name_en||'this'}. Say each line after me!`,
     ko:`안녕 나율! 오늘은 여러 가지 연습해 보자 — "${set.ko}"부터. 한 줄씩 따라 말해 봐!`, choices:[], intro:true},
    ...lines,
    {en:"You said every single line! That was a real conversation, Nayul. Bye for now!",
     ko:"한 줄도 안 빼고 다 말했어! 방금 그거 진짜 대화였어, 나율. 안녕!", choices:[], last:true}
  ];
}

/* ---------------- 🗣 영어회화 — 나율이가 직접 말한다 ----------------
   따라 말하기와 다른 점: 정해진 답이 없다. 나율이 말이 곧 대답이다.
   대신 아직 말하기가 서투니 "이렇게 말해 봐" 힌트를 늘 붙여 준다. */
const FOLLOWS=["Why do you think that?","Tell me more about that!","How did that make you feel?","What happened next?","Really? What else?","And then what?","What made you say that?"];
let usedF=[];
function nextFollow(list){
  const src=(list&&list.length)?list:FOLLOWS;
  const fresh=src.filter(f=>!usedF.includes(f));
  const f=pick(fresh.length?fresh:src);
  usedF.push(f); if(usedF.length>4) usedF.shift();
  return f;
}
// 짝이 되는 '대답하는 말'에서 첫머리를 떼어 힌트로 쓴다
function starterOf(line){
  if(!line) return "I think...";
  // 문장으로 쪼개서 가장 알맹이 있는 문장을 고른다 ("Oh, definitely." 같은 맞장구는 버린다)
  const parts=line.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
  let best=parts[0]||line;
  for(const s of parts) if(s.split(/\s+/).length>best.split(/\s+/).length) best=s;
  const w=best.split(/\s+/).slice(0,4).join(' ').replace(/[.,!?]+$/,'');
  return w.charAt(0).toUpperCase()+w.slice(1)+'...';
}
function hintsFor(ans){
  return [starterOf(ans), "I think...", "I'm not sure, but..."];
}
/* 한 주제(4~5문항)로는 10분을 못 버틴다 → 질문이 TALK_WANT 개가 될 때까지 주제를 이어 붙인다.
   새 주제로 넘어갈 때는 걸음을 따로 두지 않고 첫 질문 앞에 한마디를 붙인다(흐름이 끊기지 않게). */
const TALK_WANT=10;
function freeTalkSteps(key){
  const set=TALK_SETS[key];
  usedF=[];
  const qa=(s,lead)=>{
    const qs=s.lines.filter(L=>L.r==='q'), as=s.lines.filter(L=>L.r==='a');
    return qs.map((q,k)=>({
      en:(k===0&&lead)?lead+' '+q.en:q.en,
      ko:(k===0&&lead)?`(새 주제: ${s.name}) ${q.ko}`:q.ko,
      choices:[], ask:true, hints:hintsFor((as[k]||{}).en||'')}));
  };
  const LEADS=["Okay, different question.","Let's switch gears.","Ooh, that reminds me of something else.","New topic!"];
  let asks=qa(set);
  const rest=Object.keys(TALK_SETS).filter(k=>k!==key);
  while(asks.length<TALK_WANT && rest.length){
    const k=rest.splice(Math.floor(Math.random()*rest.length),1)[0];
    asks=asks.concat(qa(TALK_SETS[k],pick(LEADS)));
  }
  return [
    {en:`Hi Nayul! It's Emma. Let's just talk — we'll start with ${set.name_en||'you'}. Say whatever you want, I'll help you along!`,
     ko:`안녕 나율! 오늘은 그냥 이야기하자 — "${set.ko}"부터. 하고 싶은 말 아무거나 해도 돼, 힌트 줄게!`, choices:[], intro:true},
    ...asks,
    {en:"I loved talking with you, Nayul. You said so much today! See you next time.",
     ko:"너랑 이야기해서 정말 좋았어. 오늘 진짜 많이 말했다! 다음에 또 봐.", choices:[], last:true}
  ];
}
// 서버 없이도 대화가 이어지게 — 되받고 한 번 더 묻는다
function offlineReply(text,follows){
  if(/[가-힣]/.test(text)) return pick(["I see! That makes sense.","Oh, okay! I get it.","Mmm, I understand."])+' '+nextFollow(follows);
  const t=text.replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'');
  const w=t.split(' ');
  const e=(w.length>=2&&w.length<=12)?t:null;
  const low = x => /^I('|\s|$)/.test(x) ? x : x.charAt(0).toLowerCase()+x.slice(1);
  const react = e
    ? pick([`Oh, ${low(e)}! Nice.`,
            `${e.charAt(0).toUpperCase()+e.slice(1)}! I like that.`,
            `Really? ${e.charAt(0).toUpperCase()+e.slice(1)}!`,
            `Ooh, ${low(e)}.`])
    : pick(GOOD);
  return react+' '+nextFollow(follows);
}

// Emma는 내용을 하나도 모른 채 순서대로 묻기만 한다 — 지어낼 자리가 없다.
const BOX_GENERIC=[

function boxSteps(){
  const read=Math.max(1,Math.min(19,boxBook||4));
  const next=read+1;
  /* 🎯 박스카 권별 겨냥 — 새 데이터를 만들지 않고 이미 있는 BOX_TEASE(표지에 적힌 만큼)를 쓴다.
     제목이 장소를 말해 주는 권이 많다(등대·산꼭대기·통학버스…). 그 한 줄까지가 우리가 틀릴 수 없는 범위다.
     5·19권처럼 제목이 사람을 가리키면 그 사람으로 겨냥한다. 뼈대는 그대로 두고 첫 자리만 갈아 끼운다. */
  const hook=BOX_TEASE[read];
  const walk=(BOX_WALK[read]||BOX_GENERIC).map(q=>(q.id==='start'&&hook)?{...q,
    en:`I know one thing about this one: ${hook}. How did the Aldens end up mixed up in it?`,
    ko:`이 권에 대해 내가 아는 건 이거 하나야 — ${hook}. 앨든 남매가 어쩌다 거기 얽히게 됐어?`}:q);
  // 지난 권에서 한두 개만 — 기억을 되살리는 자리
  let older=[];
  for(let k=1;k<read;k++) if(BOX_ASKS[k]) older=older.concat(BOX_ASKS[k].map(q=>({...q,bk:k})));
  const back=shuffle(older).slice(0,2);
  const steps=[
    {en:`Hi Nayul! It's me, Emma. You finished book ${read} — ${BOX_TITLES[read]||''}! Let's go through it together, bit by bit.`,
     ko:`안녕 나율! 나 Emma야. ${read}권 다 읽었구나 — ${BOX_TITLES[read]||''}! 같이 한 토막씩 따라가 보자.`,
     choices:["Hi Emma!","Okay!"], model:()=>"Hi Emma!", react:()=>"Yay! I want to hear all of it."},
    {en:"First — who's your favorite? Henry, Jessie, Violet, or Benny?",
     ko:"먼저 — 누가 제일 좋아? 헨리, 제시, 바이올렛, 아니면 베니?",
     choices:["Henry","Jessie","Violet","Benny"], model:()=>"I like Benny.",
     koModel:t=>{const h=[[/헨리/,'Henry'],[/제시/,'Jessie'],[/바이올렛|바올렛/,'Violet'],[/베니|벤니/,'Benny'],[/와치|워치/,'Watch']].find(([re])=>re.test(t)); return h?`I like ${h[1]}.`:null;},
     react:t=>{const n=['Henry','Jessie','Violet','Benny','Watch'].find(x=>new RegExp(x,'i').test(t));
       if(n){state.fav=n; return `${n}! Oh, I love ${n} too.`;} return "Ooh, nice pick!";},
     follow:"What did they do in the story that made you like them?"},
    // 📖 줄거리 따라가기 — 순서대로, 한 토막씩
    ...walk.map((q,k)=>({en:q.en, ko:`📖 줄거리 따라가기 ${k+1}/${walk.length} · ${q.ko}`,
      choices:[], ask:true, hints:q.hints, follows:WALK_FOLLOWS})),
    // 지난 권 되짚기
    ...back.map(q=>({en:`By the way — from book ${q.bk}: ${q.en}`,
      ko:`그러고 보니 ${q.bk}권 얘긴데 — ${q.ko}`, choices:[], ask:true, hints:q.hints})),
  ];
  if(next<=19 && BOX_TEASE[next]){
    steps.push({en:`You told me the whole story, Nayul! Okay — book ${next} is "${BOX_TITLES[next]}". All I'll say is: ${BOX_TEASE[next]}. That's it! I'm not telling you any more.`,
      ko:`너 방금 이야기를 통째로 다 말한 거야, 나율! 자 — 다음 ${next}권은 "${BOX_TITLES[next]}". 딱 이것만 말해 줄게: ${BOX_TEASE[next]}. 끝! 더는 안 알려줘.`,
      choices:[], ask:true, hints:["That sounds fun!","Tell me more!","I want to read it!"]});
    steps.push({en:`When you finish it, come back and we'll walk through that one too. Deal?`,
      ko:`다 읽고 오면 그 권도 같이 한 토막씩 따라가자. 약속?`,
      choices:["Deal!","Okay!"], model:()=>"Deal!", react:()=>"Yes! I can't wait."});
  }
  steps.push({en:"You remembered so much, Nayul. Go read some more! Bye!",
    ko:"진짜 많이 기억하고 있구나, 나율. 얼른 더 읽으러 가! 안녕!",
    choices:["Bye, Emma!","See you!"], model:()=>"Bye, Emma!", last:true, react:()=>"Bye, Nayul!"});
  return steps;
}

 {en:"If Morgan sent you on one mission, where would you want to be sent?",
  ko:"모건이 너한테 임무 하나를 준다면 어디로 가고 싶어?", hints:["I'd want to go...","Send me to...","Somewhere with..."]}
];
let mthBook=1, audioChapter=null;
try{ mthBook=parseInt(localStorage.getItem('emmaMthBook')||'1',10)||1; }catch(e){}

function mthSteps(){
  const read=Math.max(1,Math.min(28,mthBook||1));
  const next=read+1;
  const ch=audioChapter; audioChapter=null;      // 음원에서 넘어왔을 때만 한 번 쓴다
  const title=MTH_TITLES[read]||'';
  // 권별 겨냥이 있으면 뼈대의 그 자리만 갈아 끼운다. 없는 권은 뼈대 그대로 간다.
  const aim=ch?null:mthAimed(read);
  const walk=(ch?MTH_CHAPTER(ch):MTH_WALK).map(q=>(aim&&q.id&&aim[q.id])?{...q,...aim[q.id]}:q);
  const label=ch?`챕터 ${ch} 이야기`:'줄거리 따라가기';
  const steps=[
   {en:`Hi Nayul! It's me, Emma. Magic Tree House number ${read} — "${title}"! ${ch?`You just listened to chapter ${ch}, right? Tell me about that part.`:`Let's walk through the whole trip together, bit by bit.`}`,
    ko:`안녕 나율! 나 Emma야. 매직트리하우스 ${read}권 — "${title}"! ${ch?`방금 챕터 ${ch} 들었지? 그 부분 얘기해 줘.`:`여행을 처음부터 한 토막씩 같이 따라가 보자.`}`,
    choices:["Hi Emma!","Okay!"], model:()=>"Hi Emma!", react:()=>"Yay! I want to hear all of it."},
   {en:`Quick one first — was ${ch?'that chapter':'this one'} scary, funny, or exciting?`,
    ko:`먼저 하나만 — ${ch?'그 챕터':'이번 건'} 무서웠어, 웃겼어, 신났어?`,
    choices:["Scary!","Funny!","Exciting!"], model:()=>"It was exciting!",
    koModel:t=>/무서/.test(t)?"It was scary!":/웃/.test(t)?"It was funny!":/신나|재밌/.test(t)?"It was exciting!":null,
    react:t=>{const w=['scary','funny','exciting'].find(x=>new RegExp(x,'i').test(t)); return w?`${cap(w)}! Okay, now I really want to hear it.`:"Ooh, okay!";},
    follow:"What made it feel that way?"},
   ...walk.map((q,k)=>({en:q.en, ko:`📖 ${label} ${k+1}/${walk.length} · ${q.ko}`,
     choices:[], ask:true, hints:q.hints, follows:WALK_FOLLOWS})),
   ...shuffle(MTH_BACK).slice(0,2).map(q=>({en:`By the way — ${q.en}`, ko:`그러고 보니 — ${q.ko}`,
     choices:[], ask:true, hints:q.hints}))
  ];
  if(ch){
    steps.push({en:`Go listen to the next chapter, and come back and tell me what happens. I really want to know!`,
      ko:`다음 챕터 듣고 와서 무슨 일이 있었는지 말해 줘. 진짜 궁금해!`,
      choices:["Okay!","I will!"], model:()=>"Okay, I will!", react:()=>"Yes! I'll be waiting."});
  }else if(next<=28 && MTH_TITLES[next]){
    // 다음 권은 제목만. 무슨 일이 일어나는지는 Emma도 모른다 — 그래서 나율이가 추측한다.
    steps.push({en:`You told me the whole trip, Nayul! Okay — book ${next} is called "${MTH_TITLES[next]}". That's all I know, just the title. Where do you think that one takes them?`,
      ko:`너 방금 여행을 통째로 다 말한 거야, 나율! 자 — 다음 ${next}권 제목은 "${MTH_TITLES[next]}". 내가 아는 건 제목뿐이야. 이번엔 어디로 갈 것 같아?`,
      choices:[], ask:true, hints:["Maybe they go to...","I think it's about...","Probably somewhere with..."]});
    steps.push({en:"Read it and come back — we'll walk through that one too. Deal?",
      ko:"읽고 와. 그 권도 같이 한 토막씩 따라가자. 약속?",
      choices:["Deal!","Okay!"], model:()=>"Deal!", react:()=>"Yes! I can't wait."});
  }
  const praised = !ch && next<=28 && MTH_TITLES[next];   // 맛보기 자리에서 이미 칭찬했으면 겹치지 않게
  steps.push({en:`${praised?'':(ch?'You told me that whole chapter, Nayul! ':'You told me the whole trip, Nayul! ')}You remembered so much. ${ch?'See you after the next one!':'Go climb that tree house again! Bye!'}`,
    ko:`${praised?'':(ch?'그 챕터를 통째로 다 말했어, 나율! ':'여행을 통째로 다 말했어, 나율! ')}진짜 많이 기억하고 있구나. ${ch?'다음 챕터 듣고 또 보자!':'얼른 나무 집에 또 올라가 봐! 안녕!'}`,
    choices:["Bye, Emma!","See you!"], model:()=>"Bye, Emma!", last:true, react:()=>"Bye, Nayul!"});
  return steps;
}

let aesopIdx=0;
try{ aesopIdx=parseInt(localStorage.getItem('emmaAesop')||'0',10)||0; }catch(e){}
if(!AESOP[aesopIdx]) aesopIdx=0;

function aesopSteps(){
  const f=AESOP[aesopIdx]||AESOP[0];
  const M=f.main, K=f.km||f.main, WAS=f.pl?'were':'was';
  const body=[
   {en:`I only know the title, so I'm guessing there's ${f.who} in it. Who else did you hear in the story?`,
    ko:`난 제목만 알아. ${f.kw||f.who} 나오는 것 같은데, 또 누가 나왔어?`, hints:H_WHO},
   {en:`Okay, from the beginning — what ${WAS} ${M} doing when the story starts?`,
    ko:`자, 처음부터 — 이야기가 시작될 때 ${K} 뭘 하고 있었어?`, hints:W_START},
   {en:"And then what happened? This is the part I really want to hear.",
    ko:"그러고 나서 무슨 일이 있었어? 이 부분이 제일 궁금해.", hints:W_THEN},
   {en:`How did it end? What happened to ${M}?`,
    ko:`어떻게 끝났어? ${K} 어떻게 됐어?`, hints:W_END},
   // 👇 여기부터는 Emma가 교훈을 아는 채로 '겨냥해서' 묻는다 — 막연하게 다 떠넘기지 않는다.
   //    편마다 손으로 적어 둔 pv 가 있으면 그걸 쓰고, 없으면 예전의 두루뭉술한 질문으로 물러난다.
   (f.pv ? {en:f.pv, ko:f.pvk, hints:H_WHY}
         : {en:`Why did ${M} do that, do you think?`, ko:`${K} 왜 그랬을까?`, hints:H_WHY}),
   (f.th ? {en:f.th, ko:f.thk, hints:["I think...","I'd say...","Honestly, I..."]}
         : {en:`Why did ${M} do that, do you think?`, ko:`${K} 왜 그랬을까?`, hints:H_WHY}),
   {en:"Aesop always hides a lesson in these. What do you take from this one?",
    ko:"이솝 이야기엔 늘 교훈이 숨어 있잖아. 너는 이 이야기에서 뭘 얻었어?",
    hints:["I think it means...","It teaches us that...","Maybe it's about..."]},
   {en:`Last one — tell me the whole story in three sentences. Beginning, middle, end. You already told me all of it, so this is the easy part!`,
    ko:"마지막 — 이야기를 세 문장으로 말해 줘. 처음, 중간, 끝. 아까 다 말했으니까 이건 쉬운 거야!",
    hints:["First... Then... At the end...","It's about...","So basically..."], follows:WALK_FOLLOWS}
  ];
  return [
   {en:`Hi Nayul! It's me, Emma. You just listened to "${f.en}"! I know the title but I have no idea what happens. Will you tell me?`,
    ko:`안녕 나율! 나 Emma야. 방금 "${f.en}"(${f.ko}) 들었구나! 제목은 아는데 무슨 얘긴지는 전혀 몰라. 나한테 얘기해 줄래?`,
    choices:["Okay!","Sure!"], model:()=>"Okay, I will!", react:()=>"Yay! I'm listening."},
   ...body.map((q,k)=>({en:q.en, ko:`🦊 ${k+1}/${body.length} · ${q.ko}`,
     choices:[], ask:true, hints:q.hints, follows:q.follows||WALK_FOLLOWS})),
   // 교훈은 '답'이 아니라 마지막 선물로 건넨다 — 나율이가 먼저 다 생각한 뒤에.
   // 나율이 말이 이것과 달라도 고치지 않는다(리캐스트도 여기서는 안 한다).
   {en: f.lesson
      ? `Here's what people usually take from this one: ${f.lesson} But I liked your way of putting it too, Nayul. Go listen to another one. Bye!`
      : "You told me the whole story and what you think about it. That's a lot of talking, Nayul! Go listen to another one. Bye!",
    ko: f.kl
      ? `사람들이 이 이야기에서 흔히 얻는 건 이거야 — ${f.kl} 그런데 네가 말한 것도 참 좋았어, 나율. 다른 이야기도 들으러 가. 안녕!`
      : "이야기도 다 해 주고, 네 생각까지 말해 줬어. 진짜 많이 말한 거야, 나율! 다른 이야기도 들으러 가. 안녕!",
    choices:["Bye, Emma!","See you!"], model:()=>"Bye, Emma!", last:true, react:()=>"Bye, Nayul!"}
  ];
}

/* audio: 🎧 음원 폴더 이름과 이어 주는 표시 — 들은 폴더를 보고 이 시리즈로 바로 넘어간다 */
const SERIES={
  box:{name:"The Boxcar Children", e:"🚃", ko:"박스카 칠드런", steps:()=>boxSteps(), audio:/박스카|boxcar/i},
  mth:{name:"Magic Tree House", e:"🌳", ko:"매직 트리 하우스", steps:mthSteps, audio:/magic[\s_]*tree|매직[\s_]*트리/i},
  aesop:{name:"Aesop's Fables", e:"🦊", ko:"이솝우화", steps:aesopSteps, audio:/이솝|aesop|fable/i},
  jbj:{name:"Junie B. Jones", e:"🎒", ko:"주니 비 존스", steps:JBJ_STEPS, audio:/junie|주니\s*비/i},
  mw:{name:"Mercy Watson", e:"🐷", ko:"머시 왓슨", steps:MW_STEPS, audio:/mercy|머시\s*왓슨|deckawoo/i},
  ort:{name:"Oxford Reading Tree", e:"🔑", ko:"ORT", steps:ORT_STEPS},
  dm:{name:"Dragon Masters", e:"🐉", ko:"드래곤 마스터즈", steps:()=>[...DM_STEPS.slice(0,5), DM_STEPS[6], ...sq('dm'), ...commonQs({short:true})], audio:/dragon\s*master|드래곤\s*마스터/i},
  other:{name:"다른 책", e:"📖", ko:"제목 적기", steps:OTHER_STEPS}

let series='box', otherTitle='';
try{ series=localStorage.getItem('emmaSeries')||'box'; otherTitle=localStorage.getItem('emmaOtherTitle')||''; }catch(e){}
if(!SERIES[series]) series='box';
let MODE='book';
try{ MODE=localStorage.getItem('emmaMode')||'book'; }catch(e){}
if(!['book','talk','parrot'].includes(MODE)) MODE='book';

function renderBooks(){
  const box=$('books'); box.innerHTML='';
  document.querySelectorAll('.md').forEach(b=>b.classList.toggle('on',b.dataset.md===MODE));
  if(MODE==='parrot' || MODE==='talk'){
    for(const k in TALK_SETS){
      const t=TALK_SETS[k];
      const b=document.createElement('button'); b.className='bk'+(k===topic?' on':'');
      b.innerHTML=`<span class="e">${t.e}</span>${t.name}<br><small style="opacity:.7">${t.ko}</small>`;
      b.onclick=()=>{topic=k; try{localStorage.setItem('emmaTopic',k);}catch(e){} renderBooks();};
      box.appendChild(b);
    }
    $('otherRow').classList.add('hidden');
    return;
  }
  for(const k in SERIES){
    const b=document.createElement('button'); b.className='bk'+(k===series?' on':'');
    b.innerHTML=`<span class="e">${SERIES[k].e}</span>${SERIES[k].name}<br><small style="opacity:.7">${SERIES[k].ko}</small>`;
    b.onclick=()=>{series=k; try{localStorage.setItem('emmaSeries',k);}catch(e){} renderBooks(); if(k==='other') $('otherTitle').focus();};
    box.appendChild(b);
  }
  $('otherRow').classList.toggle('hidden',series!=='other');
  $('boxRow').classList.toggle('hidden',series!=='box');
  $('mthRow').classList.toggle('hidden',series!=='mth');
  $('aesopRow').classList.toggle('hidden',series!=='aesop');
  $('boxBookNo').value=boxBook;
  $('mthBookNo').value=mthBook;
  $('aesopPick').value=String(aesopIdx);
  $('otherTitle').value=otherTitle;
}
function fillAesop(){
  const s=$('aesopPick'); s.innerHTML='';
  AESOP.forEach((f,k)=>{
    const o=document.createElement('option'); o.value=String(k);
    o.textContent=`${f.b}-${f.n}. ${f.en} · ${f.ko}`;
    s.appendChild(o);
  });
}
document.querySelectorAll('.md').forEach(b=>b.onclick=()=>{
  MODE=b.dataset.md; try{localStorage.setItem('emmaMode',MODE);}catch(e){}
  renderBooks();
});

/* ---------------- 진행 ---------------- */
let i=0, turn=0, log=[], t0=0, tick=null, lastLine='', rec=null, listening=false;
const $=id=>document.getElementById(id);
const txt=v=>typeof v==='function'?v():v;

function show(id){['start','dress','talk','end','listen'].forEach(s=>$(s).classList.toggle('hidden',s!==id));
  if(id!=='listen') stopAudio();}

/* ================= 판 번호 — 중간에 나가도 앞 판이 따라오지 않게 =================
   말하기·듣기·서버 응답은 전부 기다렸다가(await) 화면을 건드린다.
   중간에 나가면 그 기다림이 뒤늦게 깨어나 새 판에 끼어들 수 있다(반쯤 진행된 대화가 섞임).
   그래서 판마다 번호를 매기고, 기다림에서 깨어났을 때 번호가 달라졌으면 조용히 물러난다. */
let SESSION=0;
function stopInput(){
  try{ if(rec){ rec.onend=null; rec.abort?rec.abort():rec.stop(); } }catch(e){}
  rec=null; listening=false;
  try{ Emma.listen(false); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  $('mic').classList.remove('on');
}
// 판을 접고 상태를 깨끗이 비운다
function leaveTalk(){
  SESSION++; stopInput(); clearInterval(tick);
  STEPS=[]; i=0; turn=0; chat=[]; log=[]; lastLine=''; bookAdded=false;
  $('timer').textContent=''; $('booktag').textContent='';
  $('me').classList.add('hidden'); $('choices').innerHTML='';
  $('chiphint').classList.add('hidden'); $('copy').textContent='📋 나도에게 줄 기록 복사';
}
// 🏠 그만하기 — 나율이가 한 마디라도 했으면 버리지 않고 칭찬 화면(기록 저장)으로 보낸다.
function quitTalk(){
  if(log.some(l=>l.who==='나율')){ finish(); return; }
  leaveTalk(); show('start');
}

async function emmaSays(line){
  lastLine=line; $('en').textContent=line;
  log.push({who:'Emma',text:line});
  await say(line);
}

async function renderStep(){
  const my=SESSION;
  const s=STEPS[i]; if(!s) return; turn=0;
  $('me').classList.add('hidden'); $('ko').classList.add('hidden'); $('showko').textContent='뜻 보기';
  $('ko').textContent=s.ko;
  const c=$('choices'); c.innerHTML='';
  txt(s.choices).forEach(ch=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=ch;
    b.onclick=()=>{ if(!s.chipsNoSpeak) say(ch,0.85); else say(ch.replace('…','').trim(),0.85); };
    c.appendChild(b);
  });
  $('chiphint').classList.toggle('hidden',!txt(s.choices).length);
  if(txt(s.choices).length) $('chiphint').textContent =
      s.r==='q' ? '🙋 묻는 말 — 누르면 다시 읽어 줘요 → 따라 말해 봐요'
    : s.r==='a' ? '💬 대답하는 말 — 누르면 다시 읽어 줘요 → 따라 말해 봐요'
    : '누르면 Emma가 읽어 줘요 → 따라 말해 봐요';
  $('miclabel').textContent = s.practice ? '따라 말해 봐 — 눌러서 말하기'
                            : LIVE ? '눌러서 영어로 말해 봐 — 얼마든지 이어서 말해도 돼'
                            : '눌러서 영어로 말해 봐';
  $('next').textContent = s.last ? '끝내기 🎉' : '다음 →';
  if(s.practice){ await emmaSays(s.lead+' '+txt(s.en)); if(my!==SESSION) return; lastLine=txt(s.en); }
  else { await emmaSays(txt(s.en)); if(my!==SESSION) return; }
  if(!s.practice && !s.intro && !s.last){
    if(LIVE) chat.push({role:'assistant',content:txt(s.en)});
    if(s.ask) showHints(s.hints);              // 🗣 영어회화 — 늘 힌트를 붙인다
    else if(LIVE && !txt(s.choices).length) showHints(null);
  }
}

function meSaid(text,isKo){
  $('said').textContent=text; $('said').classList.toggle('ko',!!isKo);
  $('me').classList.remove('hidden');
  log.push({who:'나율',text,ko:!!isKo});
}

async function answer(text){
  const my=SESSION;
  const s=STEPS[i]; if(!s) return;
  const isKo=/[가-힣]/.test(text);
  meSaid(text,isKo);

  // 🗣 따라 말하기 — 고쳐 주지 않는다. 소리 낸 것 자체가 100점.
  if(s.practice){
    await emmaSays(isKo ? `In English we say: "${txt(s.en)}" Try it with me!` : pick(NICE_REPEAT));
    return;
  }

  // 🟢 진짜 대화 — 나율이가 무슨 말을 하든 Emma가 받아서 이어간다
  if(LIVE && !s.intro && !s.last){
    chat.push({role:'user',content:text});
    $('miclabel').textContent='💭 Emma가 생각하는 중…';
    try{
      const res=await liveReply(chat);
      if(my!==SESSION) return;
      chat.push({role:'assistant',content:res.text});
      $('miclabel').textContent='눌러서 영어로 말해 봐 — 얼마든지 이어서 말해도 돼';
      await emmaSays(res.text.trim());
      showHints(res.hints.length?res.hints:s.hints);
      return;
    }catch(e){
      if(my!==SESSION) return;
      LIVE=false; $('livetag') && $('livetag').classList.add('hidden');
      $('miclabel').textContent='눌러서 영어로 말해 봐';
      // 아래 기존 방식으로 이어서 답한다
    }
  }

  // 🗣 영어회화 — 서버가 없을 때도 이어간다
  if(s.ask){
    await emmaSays(offlineReply(text,s.follows));
    showHints(s.hints);
    return;
  }

  if(isKo){
    const model=(s.koModel&&s.koModel(text))||s.model();
    if(/모르|몰라/.test(text)) { await emmaSays("That's okay! You can pick one. "+txt(s.choices).filter(c=>!c.includes('…')).join(' Or ')+"?"); return; }
    await emmaSays(`Oh, you said it in Korean. That's okay! In English, we say: "${model}" Can you say it with me?`);
    return;
  }
  let r = (s.follow && !s.multi && turn>=1) ? pick(GOOD) : s.react(text,turn);
  turn++;
  if(s.follow && turn===1) r+=' '+txt(s.follow);
  await emmaSays(r);
  if(my!==SESSION) return;
  if(s.last) setTimeout(()=>{ if(my===SESSION) finish(); },1200);
}

/* ---------------- 마이크 ---------------- */
// 페이지가 마이크를 못 쓰는 곳(태블릿·비공개 주소 페이지 등) → 키보드 받아쓰기 칸으로 바꾼다
let micOff=false;
function micBlocked(){
  if(listening){ listening=false; Emma.listen(false); $('mic').classList.remove('on'); }
  micOff=true;
  $('mic').classList.add('hidden'); $('micko').classList.add('hidden');
  $('miclabel').innerHTML='여기서는 화면 마이크가 막혀 있어요.<br>아래 칸을 누르고 <b>키보드의 🎤 버튼</b>으로 말해 봐!';
  const d=document.querySelector('.mom'); d.open=true; d.classList.add('kbd');
  d.querySelector('summary').textContent='✍️ 키보드 마이크로 말하기';
  $('typed').placeholder='여기를 누르고 키보드 🎤 → 말하기 → 보내기';
  $('send').textContent='보내기 ➜';
  $('me').classList.add('hidden');
}
function listen(lang){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ micBlocked(); return; }
  if(listening){ rec&&rec.stop(); return; }
  speechSynthesis.cancel();
  rec=new SR(); rec.lang=lang; rec.interimResults=true; rec.maxAlternatives=1;
  let final='', blocked=false;
  rec.onresult=e=>{ let t=''; for(const r of e.results) t+=r[0].transcript; final=t; $('said').textContent=t; $('me').classList.remove('hidden'); };
  rec.onerror=e=>{ if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ blocked=true; micBlocked(); } };
  rec.onend=()=>{
    if(blocked||micOff) return;
    listening=false; Emma.listen(false); $('mic').classList.remove('on'); $('miclabel').textContent='눌러서 영어로 말해 봐';
    if(final.trim()) answer(final.trim());
    else { $('me').classList.add('hidden'); $('miclabel').textContent='잘 안 들렸어 — 다시 눌러 보거나, 위 답을 눌러 따라 해 봐'; }
  };
  try{ rec.start(); }catch(err){ micBlocked(); return; }
  listening=true; Emma.listen(true);
  $('mic').classList.add('on'); $('miclabel').textContent= lang==='ko-KR' ? '한국어로 말해 봐… (다 하면 멈춰)' : '듣고 있어… 천천히 말해 봐';
}

/* ---------------- 시간·마무리 ---------------- */
function startTimer(){
  t0=Date.now(); clearInterval(tick);
  tick=setInterval(()=>{
    const m=Math.floor((Date.now()-t0)/60000), s=Math.floor((Date.now()-t0)/1000)%60;
    $('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
    if(m>=10) $('timer').textContent+=' · 이제 인사하고 마칠까?';
  },1000);
}
const PRAISE=[
 "Emma 질문에 끝까지 대답했어.<br>한국어로 말한 것도, 한 단어로 말한 것도 다 대화야 👏",
 "먼저 말을 꺼냈지!<br>그게 제일 어려운 거야. 정말 멋졌어 🌱",
 "Emma를 따라 영어로 말해 봤어.<br>귀랑 입이 같이 자라고 있어 💛"
];
function finish(){
  clearInterval(tick); stopInput();
  const mins=Math.max(1,Math.round((Date.now()-t0)/60000));
  $('praise').innerHTML=pick(PRAISE);
  $('log').innerHTML=log.map(l=>`<div class="${l.who==='나율'?'n':''}"><b>${l.who}</b> ${l.text.replace(/</g,'&lt;')}</div>`).join('');
  const record={date:new Date().toISOString().slice(0,10),mins,
    series: state.series==='parrot' ? ('🦜 따라 말하기 · '+state.title)
          : state.series==='talk' ? ('🗣 영어회화 · '+state.title)
          : state.series==='other' ? state.title
          : ((SERIES[state.series]?SERIES[state.series].name:'책')+(state.title?(' · '+state.title):'')),
    book:state.book,fav:state.fav||state.dragon||null,live:LIVE,log};
  try{ const all=JSON.parse(localStorage.getItem('emmaLogs')||'[]'); all.push(record); localStorage.setItem('emmaLogs',JSON.stringify(all)); }catch(e){}
  window._record=record;
  SESSION++;                      // 끝난 판이 뒤늦게 화면을 건드리지 못하게
  show('end');
}
function recordText(r){
  return `[Emma 대화 기록 ${r.date} · ${r.mins}분 · ${r.series} ${r.book?('#'+r.book):'(권 모름)'} · 좋아하는 인물 ${r.fav||'모름'}]\n`+
    r.log.map(l=>`${l.who}: ${l.text}${l.ko?' (한국어)':''}`).join('\n');
}


/* ================= 🎧 음원 듣기 =================
   ⚠️ 여기에 드라이브 경로를 적지 말 것. 윗줄은 발행 스크립트가 문구로 찾아 지우니 문구를 바꾸지 말 것.
   공개 사이트에서는 서버가 없으니 버튼 자체가 안 보인다. */
let AUDIO_OK=false, audioPath='', audioStack=[], AU=null, curTrack='', lastItems=[];
async function checkAudio(){
  try{ const r=await fetch('audio/ping?who=emma',{cache:'no-store'}); if(!r.ok) return false; const j=await r.json(); return !!j.ok; }
  catch(e){ return false; }
}
function tidyName(n){
  let t=String(n).replace(/\.mp3$/i,'');
  t=t.replace(/^[A-Za-z.\s]{4,30}\s-\s/,'');                 // 작가 이름
  t=t.replace(/\s*-\s*[A-Za-z]+\s*\(Ch\)\s*$/i,'');          // 낭독자 표시
  t=t.replace(/^BC\s*0*\d+\s*-?\s*/i,'');                    // 시리즈 코드
  t=t.replace(/\s*\([^)]*voice[^)]*\)\s*/gi,' ');            // 이솝 음원의 낭독자 표시
  t=t.replace(/_/g,' ').replace(/\s+/g,' ').replace(/^[\s.\-]+|[\s.\-]+$/g,'');
  return t||String(n);
}
// 음원 폴더 이름을 책 제목으로 (A to Z처럼 한 글자면 시리즈 이름을 앞에 붙인다)
function currentBookTitle(){
  const parts=audioPath.split('/').filter(Boolean);
  const last=parts[parts.length-1]||'';
  let t=tidyName(last);
  if(t.length<=2 && parts.length>=2){
    const parent=tidyName(parts[parts.length-2]).replace(/\s*\([^)]*\)\s*/g,' ').trim();
    const eng=parent.match(/[A-Za-z][A-Za-z0-9 '&.!-]{2,}/);
    t=((eng?eng[0].trim():parent)+' · '+t).trim();
  }
  return t;
}
const fmt=s=>{ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60), x=Math.floor(s%60); return m+':'+String(x).padStart(2,'0'); };

async function openAudio(rel){
  audioPath=rel||'';
  const box=$('lstbox'); box.innerHTML='<div class="empty">불러오는 중…</div>';
  $('crumb').textContent = audioPath ? audioPath.split('/').map(tidyName).join('  ›  ') : '음원 서재';
  $('lstup').style.visibility = audioPath ? 'visible' : 'hidden';
  let j;
  try{ j=await (await fetch('audio/list?who=emma&p='+encodeURIComponent(audioPath),{cache:'no-store'})).json(); }
  catch(e){ box.innerHTML='<div class="empty">음원을 불러오지 못했어요.</div>'; return; }
  lastItems=j.items||[];
  if(!j.items || !j.items.length){ box.innerHTML='<div class="empty">여기엔 파일이 없어요.</div>'; return; }
  box.innerHTML='';
  j.items.forEach(it=>{
    const b=document.createElement('button'); b.className='lstitem';
    const mins = it.type==='file' && it.size ? Math.max(1,Math.round(it.size/1000000*1.05))+'분쯤' : '';
    b.innerHTML='<span class="ic">'+(it.type==='dir'?'📁':'🎵')+'</span><span class="nm"></span><span class="mn">'+mins+'</span>';
    b.querySelector('.nm').textContent=tidyName(it.name);
    if(it.type==='file' && it.path===curTrack) b.classList.add('playing');
    b.onclick=()=> it.type==='dir' ? openAudio(it.path) : playTrack(it.path, tidyName(it.name));
    box.appendChild(b);
  });
}

function playTrack(rel,label){
  curTrack=rel;
  $('player').classList.remove('hidden');
  $('ptitle').textContent=label;
  if(AU){ AU.pause(); AU.src=''; }
  AU=new Audio('audio/file?p='+encodeURIComponent(rel));
  AU.preload='metadata';
  let saved=0; try{ saved=parseFloat(localStorage.getItem('aupos:'+rel)||'0')||0; }catch(e){}
  AU.addEventListener('loadedmetadata',()=>{ if(saved>3 && saved<AU.duration-5) AU.currentTime=saved; $('pdur').textContent=fmt(AU.duration); });
  AU.addEventListener('timeupdate',()=>{
    $('pnow').textContent=fmt(AU.currentTime);
    $('pfill').style.width=(AU.duration?(AU.currentTime/AU.duration*100):0)+'%';
    if(Math.floor(AU.currentTime)%5===0){ try{ localStorage.setItem('aupos:'+rel,String(AU.currentTime)); }catch(e){} }
  });
  // 다 들으면 바로 말하기로 넘어가자고 부른다 — 듣기만 하고 끝나지 않게
  AU.addEventListener('ended',()=>{ $('pplay').textContent='▶'; try{ localStorage.removeItem('aupos:'+rel); }catch(e){}
    $('lstTalk').textContent='✅ 다 들었네! 이제 Emma랑 이야기하기 →'; $('lstTalk').classList.add('done'); });
  $('lstTalk').textContent='📖 이 책으로 이야기하기'; $('lstTalk').classList.remove('done');
  AU.playbackRate=parseFloat($('player').dataset.rate||'1');
  AU.play().then(()=>$('pplay').textContent='⏸').catch(()=>$('pplay').textContent='▶');
  openAudio(audioPath);
}
function audioWire(){
  $('lstup').onclick=()=>{ const p=audioPath.split('/'); p.pop(); openAudio(p.join('/')); };
  $('pplay').onclick=()=>{ if(!AU) return; if(AU.paused){ AU.play(); $('pplay').textContent='⏸'; } else { AU.pause(); $('pplay').textContent='▶'; } };
  $('pback').onclick=()=>{ if(AU) AU.currentTime=Math.max(0,AU.currentTime-10); };
  $('pfwd').onclick=()=>{ if(AU) AU.currentTime=Math.min(AU.duration||0,AU.currentTime+10); };
  $('pbar').onclick=e=>{ if(!AU||!AU.duration) return; const r=e.currentTarget.getBoundingClientRect(); AU.currentTime=(e.clientX-r.left)/r.width*AU.duration; };
  document.querySelectorAll('.prate').forEach(b=>b.onclick=()=>{
    const v=parseFloat(b.dataset.rate); $('player').dataset.rate=v; if(AU) AU.playbackRate=v;
    document.querySelectorAll('.prate').forEach(x=>x.classList.toggle('on',x===b));
  });
}
function stopAudio(){ if(AU){ AU.pause(); } }

/* 🎧 → 📖 : 방금 들은 것이 무엇인지 폴더·파일 이름에서 알아내 그 책 대화로 바로 넘긴다.
   여기가 이어지지 않으면 이 화면은 그냥 재생기가 된다. */
function chapterOf(file){
  if(/opening|credit|title|end\s*cred/i.test(file)) return null;   // 오프닝·엔딩은 챕터가 아니다
  let m=file.match(/chapter\s*(\d+)/i); if(m) return +m[1];
  m=file.match(/^\s*(\d{1,2})\s*[-.\s]/);  if(m) return +m[1];
  return null;
}
function linkFromAudio(){
  const rel=curTrack||audioPath;
  if(!rel) return false;
  const parts=rel.split('/').filter(Boolean);
  const file=/\.mp3$/i.test(parts[parts.length-1]||'') ? parts.pop() : '';
  audioChapter=null;
  for(const k in SERIES){
    const re=SERIES[k].audio;
    if(!re || !re.test(rel)) continue;
    series=k;
    if(k==='aesop'){
      const m=(file+' '+rel).match(/Book\s*(\d+)[^\d]{0,12}Fable\s*(\d+)/i);
      if(m){ const idx=AESOP.findIndex(f=>f.b===+m[1] && f.n===+m[2]);
             if(idx>=0){ aesopIdx=idx; try{localStorage.setItem('emmaAesop',String(idx));}catch(e){} } }
    }
    if(k==='mth'){
      const bf=parts.find(p=>/^\s*\d{1,2}\s*[-\s]/.test(p));
      const bn=bf?parseInt(bf.match(/^\s*(\d{1,2})/)[1],10):0;
      if(bn>=1 && bn<=28){ mthBook=bn; try{localStorage.setItem('emmaMthBook',String(bn));}catch(e){} }
      if(file) audioChapter=chapterOf(file);        // 한 챕터만 들었으면 그 챕터만 이야기한다
    }
    if(k==='box'){
      const bf=parts.find(p=>/BC\s*\d{1,3}/i.test(p));
      const bn=bf?parseInt(bf.match(/BC\s*0*(\d{1,3})/i)[1],10):0;
      if(bn>=1 && bn<=19){ boxBook=bn; try{localStorage.setItem('emmaBoxBook',String(bn));}catch(e){} }
    }
    try{localStorage.setItem('emmaSeries',series);}catch(e){}
    return true;
  }
  return false;
}
// 🎧를 누르면 지금 고른 책의 음원 폴더로 바로 들어간다
function jumpToSeries(){
  if(MODE!=='book') return;
  const re=SERIES[series] && SERIES[series].audio;
  if(!re) return;
  const hit=(lastItems||[]).find(it=>it.type==='dir' && re.test(it.name));
  if(hit) openAudio(hit.path);
}

};

function renderOpts(){
  const box=$('opts'); box.innerHTML='';

      its.appendChild(b);
    });
    wrap.appendChild(its); box.appendChild(wrap);
  }
